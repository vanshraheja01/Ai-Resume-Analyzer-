databases:
  - name: resume-analyzer-db
    plan: free
    databaseName: resume_analyzer
    user: resume_user

services:
  - type: web
    name: resume-analyzer-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: resume-analyzer-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://resume-analyzer-web.onrender.com
      - key: AI_MODE
        value: mock
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: resume-analyzer-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NEXT_PUBLIC_API_URL
        value: https://resume-analyzer-api.onrender.com
