databases:
  - name: resume-analyzer-db
    plan: free
    databaseName: resume_analyzer
    user: resume_user

services:
  - type: web
    name: resume-analyzer-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: resume-analyzer-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: AI_MODE
        value: mock
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
