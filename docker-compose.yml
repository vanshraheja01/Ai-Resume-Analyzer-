services:
  db:
    image: postgres:16-alpine
    container_name: resume_analyzer_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: resume_user
      POSTGRES_PASSWORD: resume_pass
      POSTGRES_DB: resume_analyzer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume_user -d resume_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
